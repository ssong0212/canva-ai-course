<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prompt Hub</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
:root{
  --bg:#f6f4ef; --panel:#ffffff; --ink:#1c1917; --sub:#6b6560; --line:#e5e0d8;
  --accent:#7c5cff; --accent-ink:#ffffff; --accent-soft:#efeaff;
  --chip:#eeebe4; --code-bg:#f4f1ea; --danger:#c0392b; --ok:#1e8e5a;
  --shadow:0 10px 30px rgba(28,25,23,.08);
}
:root:not([data-theme="light"]){}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#171512; --panel:#211e1a; --ink:#f0ece6; --sub:#a49d94; --line:#37322b;
    --accent:#9b82ff; --accent-ink:#171512; --accent-soft:#2c2540;
    --chip:#2c2822; --code-bg:#1b1916; --danger:#e66b5b; --ok:#4cc38a;
    --shadow:0 10px 30px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#171512; --panel:#211e1a; --ink:#f0ece6; --sub:#a49d94; --line:#37322b;
  --accent:#9b82ff; --accent-ink:#171512; --accent-soft:#2c2540;
  --chip:#2c2822; --code-bg:#1b1916; --danger:#e66b5b; --ok:#4cc38a;
  --shadow:0 10px 30px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;line-height:1.6}
header.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding:14px 20px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.logo{font-weight:900;font-size:20px;letter-spacing:-.5px;white-space:nowrap}
.logo .dot{color:var(--accent)}
.logo small{display:block;font-size:11px;font-weight:500;color:var(--sub);letter-spacing:0}
.search{flex:1;min-width:200px;position:relative}
.search input{width:100%;padding:10px 14px 10px 38px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-size:14px;font-family:inherit}
.search input:focus{outline:2px solid var(--accent);border-color:transparent}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--sub)}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:9px 14px;border-radius:12px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap;transition:transform .1s}
.btn:hover{transform:translateY(-1px)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.ghost{background:transparent}
.btn.small{padding:6px 10px;font-size:12px;border-radius:9px}
.btn.danger{color:var(--danger)}
nav.cats{display:flex;gap:8px;padding:16px 20px 4px;flex-wrap:wrap;max-width:1200px;margin:0 auto}
.cat{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:8px 14px;border-radius:999px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;display:flex;gap:6px;align-items:center}
.cat .n{font-size:11px;color:var(--sub);font-weight:500}
.cat.active{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.cat.active .n{color:var(--bg);opacity:.7}
main{max-width:1200px;margin:0 auto;padding:16px 20px 80px}
.meta-row{display:flex;justify-content:space-between;align-items:center;margin:8px 2px 14px;color:var(--sub);font-size:13px;flex-wrap:wrap;gap:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;cursor:pointer;display:flex;flex-direction:column;gap:10px;transition:transform .12s, box-shadow .12s;position:relative}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.card .cat-tag{font-size:11px;font-weight:900;letter-spacing:.5px;color:var(--accent)}
.card h3{margin:0;font-size:16px;font-weight:700;letter-spacing:-.3px;padding-right:28px}
.card p{margin:0;font-size:13px;color:var(--sub);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}
.tag{background:var(--chip);color:var(--sub);font-size:11px;padding:3px 9px;border-radius:999px}
.mine-badge{background:var(--accent-soft);color:var(--accent);font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px}
.star{position:absolute;top:14px;right:12px;background:none;border:none;cursor:pointer;font-size:18px;line-height:1;color:var(--line);padding:4px}
.star.on{color:#f5a623}
.empty{text-align:center;color:var(--sub);padding:60px 0;font-size:14px}
/* modal */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;display:flex;align-items:flex-start;justify-content:center;padding:4vh 16px;overflow-y:auto}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:20px;max-width:760px;width:100%;padding:26px 26px 22px;box-shadow:var(--shadow);margin-bottom:4vh}
.modal .cat-tag{font-size:12px;font-weight:900;color:var(--accent);letter-spacing:.5px}
.modal h2{margin:4px 0 6px;font-size:22px;letter-spacing:-.5px;line-height:1.35}
.modal .desc{color:var(--sub);font-size:14px;margin:0 0 14px}
.prompt-box{background:var(--code-bg);border:1px solid var(--line);border-radius:14px;padding:16px;font-size:13.5px;white-space:pre-wrap;word-break:break-word;max-height:46vh;overflow-y:auto;line-height:1.7}
.prompt-box .var{color:var(--accent);font-weight:700}
.tip{background:var(--accent-soft);border-radius:12px;padding:12px 14px;font-size:13px;margin-top:12px}
.tip b{color:var(--accent)}
.modal-actions{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.modal-actions .spacer{flex:1}
/* form */
.form label{display:block;font-size:13px;font-weight:700;margin:14px 0 5px}
.form input,.form textarea,.form select{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:14px;font-family:inherit}
.form textarea{min-height:160px;resize:vertical;line-height:1.6}
.form input:focus,.form textarea:focus,.form select:focus{outline:2px solid var(--accent);border-color:transparent}
.hint{font-size:12px;color:var(--sub);margin-top:4px}
/* toast */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--ink);color:var(--bg);padding:11px 20px;border-radius:999px;font-size:13px;font-weight:700;z-index:60;transition:transform .25s;pointer-events:none}
#toast.show{transform:translateX(-50%) translateY(0)}
[hidden]{display:none!important}
footer{max-width:1200px;margin:0 auto;padding:0 20px 40px;color:var(--sub);font-size:12px}
@media(max-width:640px){ .modal{padding:20px 16px} header.top{padding:12px 14px} }
</style>
</head>
<body>

<header class="top">
  <div class="logo">Prompt<span class="dot">·</span>Hub
    <small>비즈니스 AI 프롬프트 라이브러리</small>
  </div>
  <div class="search">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="프롬프트 검색 — 제목·태그·본문 (예: 스토리보드, JD, SQL)">
  </div>
  <button class="btn primary" id="btnAdd">+ 프롬프트 추가</button>
  <button class="btn ghost" id="btnExport" title="전체 프롬프트를 JSON 파일로 저장">내보내기</button>
  <button class="btn ghost" id="btnImport" title="JSON 파일에서 프롬프트 불러오기">가져오기</button>
  <input type="file" id="fileImport" accept=".json" hidden>
</header>

<nav class="cats" id="cats"></nav>

<main>
  <div class="meta-row">
    <span id="countLabel"></span>
    <label style="display:flex;gap:6px;align-items:center;cursor:pointer">
      <input type="checkbox" id="favOnly"> ⭐ 즐겨찾기만 보기
    </label>
  </div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" hidden>검색 결과가 없어요. 다른 키워드로 찾아보거나, 직접 프롬프트를 추가해 보세요.</div>
</main>

<footer>
  💡 카드를 클릭하면 전체 프롬프트를 보고 복사할 수 있어요. <b>공유 링크 복사</b>를 누르면 이 프롬프트가 담긴 URL이 생성되어 동료에게 그대로 전달할 수 있습니다.
  직접 추가한 프롬프트는 이 브라우저에 저장됩니다(내보내기로 백업 권장).
</footer>

<!-- detail modal -->
<div class="overlay" id="detailOverlay" hidden>
  <div class="modal" role="dialog" aria-modal="true">
    <div class="cat-tag" id="dCat"></div>
    <h2 id="dTitle"></h2>
    <p class="desc" id="dDesc"></p>
    <div class="prompt-box" id="dPrompt"></div>
    <div class="tip" id="dTip" hidden></div>
    <div class="tags" id="dTags" style="margin-top:12px"></div>
    <div class="modal-actions">
      <button class="btn primary" id="dCopy">📋 프롬프트 복사</button>
      <button class="btn" id="dShare">🔗 공유 링크 복사</button>
      <button class="btn" id="dSaveShared" hidden>💾 내 보관함에 저장</button>
      <span class="spacer"></span>
      <button class="btn small" id="dEdit" hidden>수정</button>
      <button class="btn small danger" id="dDelete" hidden>삭제</button>
      <button class="btn small ghost" id="dClose">닫기</button>
    </div>
  </div>
</div>

<!-- add/edit modal -->
<div class="overlay" id="formOverlay" hidden>
  <div class="modal form" role="dialog" aria-modal="true">
    <h2 id="fHeading">프롬프트 추가</h2>
    <label>제목</label>
    <input id="fTitle" placeholder="예: 신제품 런칭 보도자료 초안">
    <label>카테고리</label>
    <select id="fCat"></select>
    <label>한 줄 설명</label>
    <input id="fDesc" placeholder="이 프롬프트가 하는 일을 한 문장으로">
    <label>프롬프트 본문</label>
    <textarea id="fPrompt" placeholder="바꿔 쓸 부분은 [대괄호] 로 표시하면 화면에서 강조돼요.&#10;예: [제품명] 의 핵심 강점 3가지를 뽑아줘."></textarea>
    <div class="hint">변수는 [대괄호]로 감싸면 보라색으로 강조 표시됩니다.</div>
    <label>태그 (쉼표로 구분)</label>
    <input id="fTags" placeholder="예: 마케팅, 카피, 숏폼">
    <label>사용 팁 (선택)</label>
    <input id="fTip" placeholder="이 프롬프트를 잘 쓰는 요령이 있다면">
    <div class="modal-actions">
      <button class="btn primary" id="fSave">저장</button>
      <span class="spacer"></span>
      <button class="btn ghost" id="fCancel">취소</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
/* ================= 카테고리 ================= */
const CATS = [
  {id:'all',    name:'전체',        emoji:'🗂️'},
  {id:'prd',    name:'PRD·기획',    emoji:'📋'},
  {id:'hr',     name:'HR·인사',     emoji:'🧑‍💼'},
  {id:'image',  name:'이미지 제작',  emoji:'🎨'},
  {id:'video',  name:'영상 제작',    emoji:'🎬'},
  {id:'content',name:'콘텐츠·카피',  emoji:'✍️'},
  {id:'visual', name:'시각화 자료',  emoji:'📊'},
  {id:'data',   name:'데이터·분석',  emoji:'🔢'},
  {id:'mine',   name:'내 프롬프트',  emoji:'⭐'},
];
const catName = id => (CATS.find(c=>c.id===id)||{name:id}).name;

/* ================= 시드 프롬프트 ================= */
const SEED = [
/* ---------- PRD·기획 ---------- */
{id:'prd-1',cat:'prd',title:'PRD(제품 요구사항 문서) 초안 작성',desc:'아이디어 한 줄을 배경·목표·기능 명세·지표가 갖춰진 PRD로 확장합니다.',tags:['PRD','기획','문서'],
prompt:`너는 10년 차 프로덕트 매니저야. 아래 제품 아이디어로 PRD 초안을 작성해줘.

제품 아이디어: [아이디어 한 줄 설명]
타겟 사용자: [주 사용자층]
해결하려는 문제: [핵심 페인포인트]

PRD 구성 (반드시 이 순서로):
1. 배경 & 문제 정의 — 왜 지금 이 제품이 필요한가
2. 목표 & 비목표(Non-goals) — 이번 버전에서 하지 않을 것도 명시
3. 타겟 사용자 & 핵심 사용 시나리오 3개
4. 기능 명세 — 기능별로 [필수/권장/보류] 우선순위 표기
5. 성공 지표 — 정량 지표 3개 이상, 측정 방법 포함
6. 리스크 & 열린 질문

각 섹션은 실무에서 바로 리뷰받을 수 있는 구체성으로 작성하고,
애매한 부분은 "결정 필요" 로 표시해줘.`,
tip:'초안을 받은 뒤 "3번 시나리오를 유저 스토리로 쪼개줘"라고 이어가면 백로그까지 한 번에 만들 수 있어요.'},

{id:'prd-2',cat:'prd',title:'유저 스토리 + 수용 기준(AC) 생성',desc:'기능 하나를 개발팀에 바로 전달 가능한 유저 스토리와 Given-When-Then 수용 기준으로 변환합니다.',tags:['유저스토리','애자일','백로그'],
prompt:`아래 기능을 유저 스토리로 쪼개줘.

기능 설명: [기능 설명]
사용자 유형: [예: 신규 가입자, 관리자]

요구사항:
1. "〈사용자〉로서, 〈목적〉을 위해, 〈행동〉을 하고 싶다" 형식의 스토리 3~5개
2. 각 스토리마다 Given-When-Then 형식의 수용 기준(AC) 2~3개
3. 엣지 케이스(오류, 빈 값, 권한 없음 등)를 AC에 최소 1개씩 포함
4. 스토리별 예상 복잡도를 S/M/L로 표기

개발자가 추가 질문 없이 구현을 시작할 수 있는 수준으로 구체적으로 써줘.`,
tip:'스프린트 플래닝 전에 돌려서 AC 빠진 스토리가 없는지 점검하는 용도로도 좋아요.'},

{id:'prd-3',cat:'prd',title:'경쟁사 분석 매트릭스',desc:'경쟁 제품들을 기능·가격·타겟·차별점 축으로 비교하고 포지셔닝 기회를 도출합니다.',tags:['경쟁분석','시장조사','전략'],
prompt:`[우리 제품/서비스] 의 경쟁사 분석을 해줘.

비교 대상: [경쟁사 1], [경쟁사 2], [경쟁사 3]
우리 제품의 현재 상태: [간단 설명]

산출물:
1. 비교 매트릭스 표 — 행: 핵심 기능/가격 정책/타겟 고객/강점/약점, 열: 각 경쟁사 + 우리
2. 각 경쟁사가 "이기고 있는 지점"과 "비어 있는 지점" 정리
3. 우리가 파고들 수 있는 포지셔닝 기회 3가지 — 각각 근거와 실행 난이도 포함
4. 한 문장 포지셔닝 스테이트먼트 제안: "〈타겟〉에게 〈제품〉은 〈차별점〉을 제공하는 유일한 〈카테고리〉다"

모르는 정보는 추측하지 말고 [확인 필요] 로 표시해줘.`,
tip:'경쟁사 홈페이지 요금 페이지 내용을 함께 붙여넣으면 표의 정확도가 크게 올라갑니다.'},

{id:'prd-4',cat:'prd',title:'기능 우선순위 RICE 평가',desc:'밀린 기능 요청들을 RICE 점수로 계산해 우선순위 논쟁을 데이터로 끝냅니다.',tags:['우선순위','RICE','로드맵'],
prompt:`아래 기능 후보들을 RICE 프레임워크로 평가해서 우선순위를 매겨줘.

기능 후보 목록:
[기능 1 — 간단 설명]
[기능 2 — 간단 설명]
[기능 3 — 간단 설명]

우리 서비스 맥락: [월 사용자 규모, 팀 규모, 이번 분기 목표]

평가 방식:
- Reach: 분기당 영향받는 사용자 수 (추정 근거 명시)
- Impact: 3(대)/2(중)/1(소)/0.5(최소) — 왜 그 점수인지 한 줄 설명
- Confidence: 100%/80%/50% — 근거가 약하면 낮게
- Effort: person-month 추정
- RICE = (R × I × C) / E

결과를 점수순 표로 정리하고, 1위 기능부터 착수해야 하는 이유와
점수가 낮지만 전략적으로 고려할 만한 예외가 있다면 별도로 짚어줘.`,
tip:'Impact 점수에 대한 설명이 이상하면 그 부분만 반박해 보세요. 재평가를 시키면 논리가 정교해집니다.'},

{id:'prd-5',cat:'prd',title:'프로젝트 킥오프 문서 작성',desc:'새 프로젝트의 목표·범위·역할·일정·리스크를 한 장으로 정리한 킥오프 문서를 만듭니다.',tags:['킥오프','프로젝트관리','협업'],
prompt:`아래 정보로 프로젝트 킥오프 문서를 작성해줘.

프로젝트명: [프로젝트명]
목적: [이 프로젝트로 달성하려는 것]
기간: [시작일 ~ 목표 완료일]
참여 인원: [역할과 인원]

문서 구성:
1. 프로젝트 한 줄 요약 (엘리베이터 피치)

/* ================= 상태 ================= */
const LS_MINE='ph_myPrompts', LS_FAV='ph_favs';
function lsGet(k,f){try{const v=localStorage.getItem(k);return v?JSON.parse(v):f}catch(e){return f}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
let myPrompts=lsGet(LS_MINE,[]);
let favs=new Set(lsGet(LS_FAV,[]));
let activeCat='all', query='', favOnly=false;
let currentItem=null, sharedItem=null, editingId=null;

const $=id=>document.getElementById(id);
const allPrompts=()=>SEED.concat(myPrompts);

/* ================= 렌더 ================= */
function renderCats(){
  $('cats').innerHTML='';
  CATS.forEach(c=>{
    const n = c.id==='all' ? allPrompts().length
            : c.id==='mine' ? myPrompts.length
            : allPrompts().filter(p=>p.cat===c.id).length;
    const b=document.createElement('button');
    b.className='cat'+(activeCat===c.id?' active':'');
    b.innerHTML=`${c.emoji} ${c.name} <span class="n">${n}</span>`;
    b.onclick=()=>{activeCat=c.id;render()};
    $('cats').appendChild(b);
  });
}
function matches(p){
  if(activeCat==='mine' && !p.mine) return false;
  if(activeCat!=='all' && activeCat!=='mine' && p.cat!==activeCat) return false;
  if(favOnly && !favs.has(p.id)) return false;
  if(query){
    const hay=(p.title+' '+p.desc+' '+p.tags.join(' ')+' '+p.prompt).toLowerCase();
    if(!query.toLowerCase().split(/\s+/).every(w=>hay.includes(w))) return false;
  }
  return true;
}
function renderGrid(){
  const list=allPrompts().filter(matches);
  $('grid').innerHTML='';
  $('empty').hidden=list.length>0;
  $('countLabel').textContent=`${list.length}개 프롬프트`;
  list.forEach(p=>{
    const card=document.createElement('div');
    card.className='card';
    card.innerHTML=`
      <div class="cat-tag">${catName(p.cat)}</div>
      <h3></h3><p></p>
      <div class="tags"></div>`;
    card.querySelector('h3').textContent=p.title;
    card.querySelector('p').textContent=p.desc;
    const tags=card.querySelector('.tags');
    if(p.mine){const m=document.createElement('span');m.className='mine-badge';m.textContent='내 프롬프트';tags.appendChild(m)}
    p.tags.slice(0,4).forEach(t=>{const s=document.createElement('span');s.className='tag';s.textContent='#'+t;tags.appendChild(s)});
    const star=document.createElement('button');
    star.className='star'+(favs.has(p.id)?' on':'');
    star.textContent='★'; star.title='즐겨찾기';
    star.onclick=e=>{e.stopPropagation();toggleFav(p.id)};
    card.appendChild(star);
    card.onclick=()=>openDetail(p);
    $('grid').appendChild(card);
  });
}
function render(){renderCats();renderGrid()}

function toggleFav(id){
  favs.has(id)?favs.delete(id):favs.add(id);
  lsSet(LS_FAV,[...favs]); render();
}

/* ================= 상세 모달 ================= */
function highlightVars(text){
  const esc=text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  return esc.replace(/\[([^\[\]\n]{1,60})\]/g,'<span class="var">[$1]</span>');
}
function openDetail(p, isShared){
  currentItem=p; sharedItem=isShared?p:null;
  $('dCat').textContent=catName(p.cat);
  $('dTitle').textContent=p.title;
  $('dDesc').textContent=p.desc;
  $('dPrompt').innerHTML=highlightVars(p.prompt);
  $('dTip').hidden=!p.tip;
  if(p.tip) $('dTip').innerHTML='<b>💡 사용 팁</b> — '+p.tip.replace(/</g,'&lt;');
  const tags=$('dTags'); tags.innerHTML='';
  p.tags.forEach(t=>{const s=document.createElement('span');s.className='tag';s.textContent='#'+t;tags.appendChild(s)});
  $('dEdit').hidden=!p.mine; $('dDelete').hidden=!p.mine;
  $('dSaveShared').hidden=!isShared;
  $('detailOverlay').hidden=false;
}
$('dClose').onclick=()=>{$('detailOverlay').hidden=true};
$('detailOverlay').onclick=e=>{if(e.target===$('detailOverlay'))$('detailOverlay').hidden=true};

/* 복사 (클립보드 API 실패 시 폴백) */
function copyText(text,msg){
  const done=()=>toast(msg||'복사했어요!');
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(()=>fallbackCopy(text,done));
  }else fallbackCopy(text,done);
}
function fallbackCopy(text,done){
  const ta=document.createElement('textarea');
  ta.value=text; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try{document.execCommand('copy');done()}catch(e){toast('복사 실패 — 본문을 직접 선택해 주세요')}
  document.body.removeChild(ta);
}
$('dCopy').onclick=()=>copyText(currentItem.prompt,'프롬프트를 복사했어요!');

/* ================= 공유 링크 ================= */
function encodeShare(p){
  const payload={t:p.title,c:p.cat,d:p.desc,p:p.prompt,g:p.tags,i:p.tip||''};
  const json=JSON.stringify(payload);
  return btoa(String.fromCharCode(...new TextEncoder().encode(json)))
    .replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function decodeShare(s){
  try{
    s=s.replace(/-/g,'+').replace(/_/g,'/');
    while(s.length%4)s+='=';
    const bytes=Uint8Array.from(atob(s),ch=>ch.charCodeAt(0));
    const o=JSON.parse(new TextDecoder().decode(bytes));
    return {id:'shared-'+Date.now(),cat:o.c||'content',title:o.t||'공유된 프롬프트',desc:o.d||'',prompt:o.p||'',tags:o.g||[],tip:o.i||''};
  }catch(e){return null}
}
$('dShare').onclick=()=>{
  const url=location.origin+location.pathname+'#p='+encodeShare(currentItem);
  copyText(url,'공유 링크를 복사했어요! 붙여넣어 전달하세요.');
};
$('dSaveShared').onclick=()=>{
  const p=Object.assign({},sharedItem,{id:'my-'+Date.now(),mine:true});
  myPrompts.push(p); lsSet(LS_MINE,myPrompts);
  $('detailOverlay').hidden=true;
  history.replaceState(null,'',location.pathname);
  toast('내 보관함에 저장했어요!'); render();
};
function checkShareHash(){
  const m=location.hash.match(/^#p=(.+)$/);
  if(!m)return;
  const p=decodeShare(m[1]);
  if(p) openDetail(p,true);
}

/* ================= 추가/수정 ================= */
function openForm(p){
  editingId=p?p.id:null;
  $('fHeading').textContent=p?'프롬프트 수정':'프롬프트 추가';
  const sel=$('fCat'); sel.innerHTML='';
  CATS.filter(c=>!['all','mine'].includes(c.id)).forEach(c=>{
    const o=document.createElement('option');o.value=c.id;o.textContent=c.emoji+' '+c.name;sel.appendChild(o);
  });
  $('fTitle').value=p?p.title:'';
  $('fCat').value=p?p.cat:'content';
  $('fDesc').value=p?p.desc:'';
  $('fPrompt').value=p?p.prompt:'';
  $('fTags').value=p?p.tags.join(', '):'';
  $('fTip').value=p&&p.tip?p.tip:'';
  $('formOverlay').hidden=false;
  $('fTitle').focus();
}
$('btnAdd').onclick=()=>openForm(null);
$('fCancel').onclick=()=>{$('formOverlay').hidden=true};
$('formOverlay').onclick=e=>{if(e.target===$('formOverlay'))$('formOverlay').hidden=true};
$('fSave').onclick=()=>{
  const title=$('fTitle').value.trim(), prompt=$('fPrompt').value.trim();
  if(!title||!prompt){toast('제목과 프롬프트 본문은 필수예요');return}
  const item={
    id:editingId||('my-'+Date.now()), mine:true,
    cat:$('fCat').value, title, prompt,
    desc:$('fDesc').value.trim()||'직접 추가한 프롬프트',
    tags:$('fTags').value.split(',').map(s=>s.trim()).filter(Boolean),
    tip:$('fTip').value.trim(),
  };
  if(editingId){
    myPrompts=myPrompts.map(p=>p.id===editingId?item:p);
  }else myPrompts.push(item);
  lsSet(LS_MINE,myPrompts);
  $('formOverlay').hidden=true;
  toast(editingId?'수정했어요!':'프롬프트를 추가했어요!');
  editingId=null; render();
};
$('dEdit').onclick=()=>{$('detailOverlay').hidden=true;openForm(currentItem)};
$('dDelete').onclick=()=>{
  if(!confirm('이 프롬프트를 삭제할까요?'))return;
  myPrompts=myPrompts.filter(p=>p.id!==currentItem.id);
  lsSet(LS_MINE,myPrompts); favs.delete(currentItem.id); lsSet(LS_FAV,[...favs]);
  $('detailOverlay').hidden=true; toast('삭제했어요'); render();
};

/* ================= 내보내기/가져오기 ================= */
$('btnExport').onclick=()=>{
  const data={exportedAt:new Date().toISOString(),prompts:allPrompts()};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download='prompt-hub-export.json';
  a.click(); URL.revokeObjectURL(a.href);
  toast('JSON 파일로 내보냈어요');
};
$('btnImport').onclick=()=>$('fileImport').click();
$('fileImport').onchange=e=>{
  const f=e.target.files[0]; if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const data=JSON.parse(r.result);
      const arr=Array.isArray(data)?data:(data.prompts||[]);
      const existing=new Set(allPrompts().map(p=>p.title+'|'+p.cat));
      let added=0;
      arr.forEach(p=>{
        if(!p.title||!p.prompt)return;
        if(existing.has(p.title+'|'+(p.cat||'content')))return;
        myPrompts.push({
          id:'my-'+Date.now()+'-'+added, mine:true,
          cat:CATS.some(c=>c.id===p.cat)?p.cat:'content',
          title:String(p.title), prompt:String(p.prompt),
          desc:String(p.desc||''), tags:Array.isArray(p.tags)?p.tags.map(String):[],
          tip:String(p.tip||''),
        }); added++;
      });
      lsSet(LS_MINE,myPrompts);
      toast(added?`${added}개 프롬프트를 가져왔어요`:'새로 가져올 프롬프트가 없어요');
      render();
    }catch(err){toast('JSON 파일을 읽지 못했어요')}
    e.target.value='';
  };
  r.readAsText(f);
};

/* ================= 검색/필터 ================= */
$('q').oninput=e=>{query=e.target.value.trim();renderGrid()};
$('favOnly').onchange=e=>{favOnly=e.target.checked;renderGrid()};
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){$('detailOverlay').hidden=true;$('formOverlay').hidden=true}
  if(e.key==='/'&&document.activeElement.tagName!=='INPUT'&&document.activeElement.tagName!=='TEXTAREA'){
    e.preventDefault();$('q').focus();
  }
});

/* ================= 토스트 ================= */
let toastTimer;
function toast(msg){
  const t=$('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),2200);
}

window.addEventListener('hashchange',checkShareHash);

render();
checkShareHash();
</script>
